<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limeet</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f5f3;
    --grey-100: #1a1a1a;
    --grey-200: #2a2a2a;
    --grey-300: #3d3d3d;
    --grey-400: #6b6b6b;
    --grey-500: #9a9a9a;
    --violet: #7c3aed;
    --violet-light: #a855f7;
    --violet-dim: rgba(124, 58, 237, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--white); height: 100vh; overflow: hidden; }

  /* AUTH */
  #auth-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; background: var(--black); position: relative; overflow: hidden;
  }
  #auth-screen::before {
    content: ''; position: absolute; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 70%);
    top: -100px; right: -100px; pointer-events: none;
  }
  #auth-screen::after {
    content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
    bottom: -80px; left: -80px; pointer-events: none;
  }
  .auth-box {
    width: 420px; background: var(--grey-100); border: 1px solid var(--grey-200);
    border-radius: 20px; padding: 48px 40px; position: relative; z-index: 1; animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .auth-logo { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
  .auth-logo span { color: var(--violet-light); }
  .auth-tagline { color: var(--grey-400); font-size: 14px; margin-bottom: 36px; }
  .auth-tabs { display: flex; gap: 4px; background: var(--grey-200); border-radius: 10px; padding: 4px; margin-bottom: 28px; }
  .auth-tab { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: var(--grey-400); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .auth-tab.active { background: var(--violet); color: var(--white); }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--grey-400); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .form-input { width: 100%; padding: 12px 16px; background: var(--grey-200); border: 1px solid var(--grey-300); border-radius: 10px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--violet); }
  .form-input::placeholder { color: var(--grey-400); }
  .btn-primary { width: 100%; padding: 14px; background: var(--violet); border: none; border-radius: 10px; color: var(--white); font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; letter-spacing: 0.3px; }
  .btn-primary:hover { background: var(--violet-light); transform: translateY(-1px); }
  .auth-error { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }

  /* APP */
  #app-screen { display: none; height: 100vh; flex-direction: row; }

  /* SIDEBAR */
  .sidebar { width: 320px; min-width: 320px; background: var(--grey-100); border-right: 1px solid var(--grey-200); display: flex; flex-direction: column; height: 100vh; }
  .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--grey-200); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .sidebar-logo span { color: var(--violet-light); }
  .sidebar-actions { display: flex; gap: 8px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; background: var(--grey-200); border: none; color: var(--grey-400); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.18s; font-size: 16px; }
  .icon-btn:hover { background: var(--grey-300); color: var(--white); }
  .icon-btn.active { background: var(--violet-dim); color: var(--violet-light); }
  .search-bar { padding: 12px 16px; border-bottom: 1px solid var(--grey-200); }
  .search-input-wrap { display: flex; align-items: center; background: var(--grey-200); border: 1px solid var(--grey-300); border-radius: 10px; padding: 8px 12px; gap: 8px; transition: border-color 0.2s; }
  .search-input-wrap:focus-within { border-color: var(--violet); }
  .search-input-wrap input { background: none; border: none; outline: none; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px; width: 100%; }
  .search-input-wrap input::placeholder { color: var(--grey-400); }
  .chat-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .chat-list::-webkit-scrollbar { width: 4px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--grey-300); border-radius: 2px; }
  .chat-item { display: flex; align-items: center; padding: 10px 16px; gap: 12px; cursor: pointer; transition: background 0.15s; position: relative; }
  .chat-item:hover { background: var(--grey-200); }
  .chat-item.active { background: var(--violet-dim); }
  .chat-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; background: var(--violet-light); border-radius: 0 2px 2px 0; }

  .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--grey-300); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; flex-shrink: 0; position: relative; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar.online::after { content: ''; position: absolute; width: 11px; height: 11px; background: #22c55e; border: 2px solid var(--grey-100); border-radius: 50%; bottom: 1px; right: 1px; z-index: 2; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .chat-preview { font-size: 13px; color: var(--grey-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .chat-time { font-size: 12px; color: var(--grey-400); }
  .chat-badge { background: var(--violet); color: var(--white); font-size: 11px; font-weight: 600; border-radius: 10px; padding: 2px 6px; min-width: 20px; text-align: center; }
  .sidebar-bottom { border-top: 1px solid var(--grey-200); padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
  .sidebar-bottom:hover { background: var(--grey-200); }
  .sidebar-user { flex: 1; }
  .sidebar-user-name { font-size: 14px; font-weight: 500; }
  .sidebar-user-id { font-size: 12px; color: var(--grey-400); }

  /* CHAT MAIN */
  .chat-main { flex: 1; display: flex; flex-direction: column; height: 100vh; background: var(--black); position: relative; }
  .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--grey-200); display: flex; align-items: center; gap: 14px; background: var(--grey-100); }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 17px; }
  .chat-header-status { font-size: 13px; color: var(--grey-400); }
  .chat-header-status.online { color: #22c55e; }
  .messages-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 4px; }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--grey-300); border-radius: 2px; }
  .msg-date { text-align: center; font-size: 12px; color: var(--grey-400); margin: 12px 0; display: flex; align-items: center; gap: 10px; }
  .msg-date::before, .msg-date::after { content: ''; flex: 1; height: 1px; background: var(--grey-200); }
  .msg-row { display: flex; align-items: flex-end; gap: 8px; animation: msgIn 0.2s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.me { flex-direction: row-reverse; }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--grey-300); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 10px; flex-shrink: 0; margin-bottom: 2px; overflow: hidden; }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .msg-bubble { max-width: 60%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
  .msg-row.them .msg-bubble { background: var(--grey-200); border-radius: 4px 16px 16px 16px; }
  .msg-row.me .msg-bubble { background: var(--violet); border-radius: 16px 4px 16px 16px; }
  .msg-time { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; text-align: right; }
  .msg-row.me + .msg-row.me .msg-avatar, .msg-row.them + .msg-row.them .msg-avatar { visibility: hidden; }
  .typing-dots { display: flex; gap: 4px; background: var(--grey-200); padding: 10px 14px; border-radius: 4px 16px 16px 16px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--grey-400); animation: typingBounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
  .message-input-bar { padding: 16px 24px; background: var(--grey-100); border-top: 1px solid var(--grey-200); display: flex; align-items: center; gap: 12px; }
  .msg-input-wrap { flex: 1; display: flex; align-items: center; background: var(--grey-200); border: 1px solid var(--grey-300); border-radius: 12px; padding: 10px 16px; gap: 10px; transition: border-color 0.2s; }
  .msg-input-wrap:focus-within { border-color: var(--violet); }
  .msg-input { flex: 1; background: none; border: none; outline: none; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 15px; resize: none; max-height: 100px; }
  .msg-input::placeholder { color: var(--grey-400); }
  .send-btn { width: 42px; height: 42px; border-radius: 10px; background: var(--violet); border: none; color: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.18s; flex-shrink: 0; }
  .send-btn:hover { background: var(--violet-light); transform: scale(1.05); }

  /* EMPTY */
  .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--grey-400); }
  .chat-empty-icon { width: 72px; height: 72px; border-radius: 20px; background: var(--grey-200); display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 8px; }
  .chat-empty h3 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--white); }

  /* PROFILE PANEL */
  .profile-panel { display: none; width: 340px; min-width: 340px; background: var(--grey-100); border-left: 1px solid var(--grey-200); flex-direction: column; height: 100vh; overflow-y: auto; }
  .profile-panel.open { display: flex; }
  .profile-panel::-webkit-scrollbar { width: 4px; }
  .profile-panel::-webkit-scrollbar-thumb { background: var(--grey-300); border-radius: 2px; }
  .panel-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--grey-200); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .panel-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }

  /* Avatar upload area */
  .profile-cover {
    height: 120px;
    background: linear-gradient(135deg, var(--violet) 0%, #1a1a1a 100%);
    position: relative;
    flex-shrink: 0;
  }
  .profile-avatar-wrap {
    position: absolute;
    bottom: -44px;
    left: 24px;
  }
  .profile-avatar-large {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--grey-200);
    border: 4px solid var(--grey-100);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-upload-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
    cursor: pointer;
    font-size: 22px;
  }
  .profile-avatar-large:hover .avatar-upload-overlay { opacity: 1; }
  #avatar-file-input { display: none; }

  .profile-info { padding: 56px 24px 24px; }
  .profile-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; margin-bottom: 4px; }
  .profile-username { color: var(--grey-400); font-size: 14px; margin-bottom: 4px; }

  .profile-bio-display {
    font-size: 14px;
    line-height: 1.6;
    color: var(--grey-500);
    margin-bottom: 16px;
    min-height: 20px;
    font-style: italic;
  }
  .profile-bio-display.empty { color: var(--grey-300); }

  .profile-stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .profile-stat { background: var(--grey-200); border-radius: 10px; padding: 12px 10px; flex: 1; text-align: center; }
  .profile-stat-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 20px; }
  .profile-stat-lbl { font-size: 11px; color: var(--grey-400); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  .profile-field { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--grey-200); }
  .profile-field-icon { color: var(--violet-light); font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
  .profile-field-label { font-size: 12px; color: var(--grey-400); margin-bottom: 2px; }
  .profile-field-value { font-size: 14px; }

  .birthday-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--violet-dim); border: 1px solid var(--violet);
    border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--violet-light);
    margin-top: 6px;
  }

  .edit-btn { width: 100%; padding: 12px; border: 1px solid var(--violet); background: transparent; border-radius: 10px; color: var(--violet-light); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: all 0.2s; }
  .edit-btn:hover { background: var(--violet-dim); }
  .logout-btn { width: 100%; padding: 12px; border: 1px solid var(--grey-300); background: transparent; border-radius: 10px; color: #f87171; font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
  .logout-btn:hover { background: rgba(248,113,113,0.1); border-color: #f87171; }

  /* SEARCH PANEL */
  .search-panel { display: none; position: absolute; top: 0; left: 320px; right: 0; bottom: 0; background: var(--black); z-index: 10; flex-direction: column; }
  .search-panel.open { display: flex; }
  .search-panel-header { padding: 20px 24px; border-bottom: 1px solid var(--grey-200); background: var(--grey-100); display: flex; align-items: center; gap: 16px; }
  .search-big-input { flex: 1; background: var(--grey-200); border: 1px solid var(--grey-300); border-radius: 12px; padding: 12px 16px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; transition: border-color 0.2s; }
  .search-big-input:focus { border-color: var(--violet); }
  .search-big-input::placeholder { color: var(--grey-400); }
  .search-filter-tabs { display: flex; gap: 8px; padding: 16px 24px; border-bottom: 1px solid var(--grey-200); }
  .filter-tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--grey-300); background: transparent; color: var(--grey-400); transition: all 0.18s; }
  .filter-tab.active { background: var(--violet); border-color: var(--violet); color: var(--white); }
  .search-results { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .search-result-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--grey-200); }
  .result-info { flex: 1; }
  .result-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .result-sub { font-size: 13px; color: var(--grey-400); }
  .start-chat-btn { padding: 8px 16px; background: var(--violet-dim); border: 1px solid var(--violet); border-radius: 8px; color: var(--violet-light); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.18s; font-family: 'DM Sans', sans-serif; }
  .start-chat-btn:hover { background: var(--violet); color: var(--white); }
  .no-results { text-align: center; padding: 60px 24px; color: var(--grey-400); }
  .no-results-icon { font-size: 48px; margin-bottom: 16px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--grey-100); border: 1px solid var(--grey-200); border-radius: 20px; padding: 36px 32px; width: 460px; max-width: 95vw; animation: fadeUp 0.25s ease; }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 24px; }

  /* Avatar picker inside modal */
  .modal-avatar-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
    gap: 12px;
  }
  .modal-avatar-preview {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: var(--grey-200);
    border: 3px solid var(--grey-300);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 32px;
    overflow: hidden; cursor: pointer; position: relative;
    transition: border-color 0.2s;
  }
  .modal-avatar-preview:hover { border-color: var(--violet); }
  .modal-avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .modal-avatar-preview .avatar-upload-overlay { opacity: 0; }
  .modal-avatar-preview:hover .avatar-upload-overlay { opacity: 1; }
  .avatar-hint { font-size: 12px; color: var(--grey-400); }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-secondary { flex: 1; padding: 12px; background: var(--grey-200); border: 1px solid var(--grey-300); border-radius: 10px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: background 0.18s; }
  .btn-secondary:hover { background: var(--grey-300); }
  .btn-primary-modal { flex: 1; padding: 12px; background: var(--violet); border: none; border-radius: 10px; color: var(--white); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.18s; }
  .btn-primary-modal:hover { background: var(--violet-light); }

  /* form-textarea */
  .form-textarea { width: 100%; padding: 12px 16px; background: var(--grey-200); border: 1px solid var(--grey-300); border-radius: 10px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; resize: vertical; min-height: 80px; }
  .form-textarea:focus { border-color: var(--violet); }
  .form-textarea::placeholder { color: var(--grey-400); }

  .char-count { font-size: 11px; color: var(--grey-400); text-align: right; margin-top: 4px; }

  /* delete avatar btn */
  .del-avatar-btn { background: none; border: 1px solid #f87171; color: #f87171; border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: all 0.18s; font-family: 'DM Sans', sans-serif; }
  .del-avatar-btn:hover { background: rgba(248,113,113,0.1); }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Li<span>meet</span></div>
    <div class="auth-tagline">Общайтесь без ограничений</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Войти</button>
      <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
    </div>
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Телефон или ID</label>
        <input class="form-input" id="login-id" type="text" placeholder="+7 900 000-00-00 или @username">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="handleLogin()">Войти</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label class="form-label">Имя</label>
        <input class="form-input" id="reg-name" type="text" placeholder="Ваше имя">
      </div>
      <div class="form-group">
        <label class="form-label">Номер телефона</label>
        <input class="form-input" id="reg-phone" type="tel" placeholder="+7 900 000-00-00">
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" id="reg-username" type="text" placeholder="@username">
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="Минимум 6 символов">
      </div>
      <button class="btn-primary" onclick="handleRegister()">Создать аккаунт</button>
    </div>

<script>
// ═══ STATE ═══
let currentUser = null;
let activeChat = null;
let searchFilter = 'all';
let profileMode = 'me';

const usersDB = [

];

const messagesDB = {
  u1: [
    { from: 'u1', text: 'Привет! Как дела?', time: '10:23' },
    { from: 'me', text: 'Всё хорошо, спасибо! А у тебя?', time: '10:24' },

    { from: 'me', text: 'Расскажи подробнее, звучит интересно!', time: '10:26' },

  ],

    { from: 'u2', text: 'Привет, есть минутка?', time: '09:15' },
    { from: 'me', text: 'Да, что случилось?', time: '09:16' },
    { from: 'u2', text: 'Пришли ссылку на репозиторий пожалуйста', time: '09:17' },
  ],
  u3: [
    { from: 'u3', text: 'Посмотри новые фото! 📸', time: 'Вчера' },
    { from: 'me', text: 'Очень красиво! Где снимала?', time: 'Вчера' },
    { from: 'u3', text: 'В Коломенском, закат был просто огонь 🔥', time: 'Вчера' },
  ],
  u4: [],
  u5: [
    { from: 'u5', text: 'Ты читал «Мастер и Маргарита»?', time: 'Пн' },
    { from: 'me', text: 'Конечно! Одна из любимых книг', time: 'Пн' },
  ],
};
const chatPreviews = { u1: 'Да, делаем мессенджер...', u2: 'Пришли ссылку на репозиторий', u3: 'В Коломенском, закат был просто...', u4: 'Нет сообщений', u5: 'Конечно! Одна из любимых книг' };
const chatTimes   = { u1: '10:27', u2: '09:17', u3: 'Вчера', u4: '', u5: 'Пн' };
const chatBadges  = { u1: 0, u2: 2, u3: 0, u4: 0, u5: 1 };

function getInitials(name) { return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

// ──────────────── AVATAR HELPERS ────────────────
function renderAvatarEl(el, user, size) {
  el.style.background = user.color || '#7c3aed';
  if (size) { el.style.width = size; el.style.height = size; }
  if (user.avatar) {
    el.innerHTML = `<img src="${user.avatar}" alt="">`;
  } else {
    el.innerHTML = getInitials(user.name);
  }
}

// ──────────────── AUTH ────────────────
let activeTab = 'login';
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('register-form').style.display = tab==='register'?'block':'none';
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('auth-error').textContent='';
}

function handleLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!id||!pass){showAuthError('Заполните все поля');return;}
  const stored = JSON.parse(localStorage.getItem('limeet_users')||'[]');
  const user = stored.find(u=>(u.username===id||u.phone===id)&&u.password===pass);
  if (!user){showAuthError('Неверный логин или пароль');return;}
  loginUser(user);
}

function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!name||!phone||!username||!pass){showAuthError('Заполните все поля');return;}
  if (pass.length<6){showAuthError('Пароль минимум 6 символов');return;}
  const uname = username.startsWith('@')?username:'@'+username;
  const stored = JSON.parse(localStorage.getItem('limeet_users')||'[]');
  if (stored.find(u=>u.username===uname)){showAuthError('Этот username уже занят');return;}
  if (stored.find(u=>u.phone===phone)){showAuthError('Этот номер уже зарегистрирован');return;}
  const newUser = { id:'user_'+Date.now(), name, phone, username:uname, password:pass, bio:'', color:'#7c3aed', online:true, days:0, joinDate:Date.now(), avatar:null, birthday:null };
  stored.push(newUser);
  localStorage.setItem('limeet_users', JSON.stringify(stored));
  loginUser(newUser);
}

function showAuthError(msg){document.getElementById('auth-error').textContent=msg;}

function loginUser(user) {
  currentUser = user;
  localStorage.setItem('limeet_current', JSON.stringify(user));
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='flex';
  initApp();
}

// ──────────────── APP INIT ────────────────
function initApp() {
  const avEl = document.getElementById('my-avatar-small');
  avEl.style.width='38px'; avEl.style.height='38px'; avEl.style.fontSize='14px';
  renderAvatarEl(avEl, currentUser);
  document.getElementById('my-name-sidebar').textContent = currentUser.name;
  document.getElementById('my-id-sidebar').textContent = currentUser.username;
  renderChatList(usersDB);
}

function renderChatList(users) {
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  users.forEach(u => {
    const badges = chatBadges[u.id]||0;
    const div = document.createElement('div');
    div.className = 'chat-item'+(activeChat===u.id?' active':'');
    div.onclick = ()=>openChat(u.id);
    const avHTML = u.avatar
      ? `<div class="avatar${u.online?' online':''}" style="background:${u.color}"><img src="${u.avatar}" alt=""></div>`
      : `<div class="avatar${u.online?' online':''}" style="background:${u.color}">${getInitials(u.name)}</div>`;
    div.innerHTML = `
      ${avHTML}
      <div class="chat-info">
        <div class="chat-name">${u.name}</div>
        <div class="chat-preview">${chatPreviews[u.id]||'Нет сообщений'}</div>
      </div>
      <div class="chat-meta">
        <div class="chat-time">${chatTimes[u.id]||''}</div>
        ${badges?`<div class="chat-badge">${badges}</div>`:''}
      </div>`;
    list.appendChild(div);
  });
}

function filterChats(q) {
  const filtered = usersDB.filter(u=>u.name.toLowerCase().includes(q.toLowerCase())||u.username.toLowerCase().includes(q.toLowerCase()));
  renderChatList(filtered);
}

// ──────────────── CHAT ────────────────
function openChat(userId) {
  activeChat = userId;
  chatBadges[userId] = 0;
  const user = usersDB.find(u=>u.id===userId);
  document.getElementById('empty-state').style.display='none';
  const cv = document.getElementById('chat-view');
  cv.style.display='flex';

  const hAv = document.getElementById('chat-header-avatar');
  renderAvatarEl(hAv, user);
  if (user.online) hAv.classList.add('online'); else hAv.classList.remove('online');
  document.getElementById('chat-header-name').textContent = user.name;
  const st = document.getElementById('chat-header-status');
  st.textContent = user.online?'В сети':'Не в сети';
  st.className = 'chat-header-status'+(user.online?' online':'');

  renderMessages(userId);
  renderChatList(usersDB);
  document.getElementById('profile-panel').classList.remove('open');
}

function renderMessages(userId) {
  const area = document.getElementById('messages-area');
  const msgs = messagesDB[userId]||[];
  area.innerHTML = '';
  if (!msgs.length) {
    area.innerHTML='<div style="text-align:center;color:var(--grey-400);font-size:14px;padding:40px 0;">Нет сообщений. Напишите первым!</div>';
    return;
  }
  area.innerHTML='<div class="msg-date">Сегодня</div>';
  msgs.forEach(msg => {
    const isMe = msg.from==='me';
    const user = usersDB.find(u=>u.id===msg.from);
    const avHTML = isMe
      ? (currentUser.avatar ? `<img src="${currentUser.avatar}" alt="">` : getInitials(currentUser.name))
      : (user?.avatar ? `<img src="${user.avatar}" alt="">` : (user?getInitials(user.name):'?'));
    const color = isMe ? (currentUser.color||'#7c3aed') : (user?.color||'#3d3d3d');
    const row = document.createElement('div');
    row.className = 'msg-row '+(isMe?'me':'them');
    row.innerHTML = `
      <div class="msg-avatar" style="background:${color}">${avHTML}</div>
      <div>
        <div class="msg-bubble">${msg.text}</div>
        <div class="msg-time">${msg.time}</div>
      </div>`;
    area.appendChild(row);
  });
  area.scrollTop = area.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text||!activeChat) return;
  const now = new Date();
  const time = now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  if (!messagesDB[activeChat]) messagesDB[activeChat]=[];
  messagesDB[activeChat].push({from:'me',text,time});
  chatPreviews[activeChat] = text.length>30?text.slice(0,30)+'...':text;
  chatTimes[activeChat] = time;
  input.value='';
  renderMessages(activeChat);
  renderChatList(usersDB);

  const user = usersDB.find(u=>u.id===activeChat);
  if (user&&user.online) {
    setTimeout(()=>{
      const area = document.getElementById('messages-area');
      if (!area) return;
      const typingRow = document.createElement('div');
      typingRow.className='msg-row them';
      const avHTML = user.avatar?`<img src="${user.avatar}" alt="">`:getInitials(user.name);
      typingRow.innerHTML=`<div class="msg-avatar" style="background:${user.color}">${avHTML}</div><div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      area.appendChild(typingRow);
      area.scrollTop=area.scrollHeight;
      const replies=['Понял, спасибо! 👍','Окей, договорились!','Хорошо, напишу позже','Ага, вижу 😊','Отлично! Будем на связи','Спасибо за инфо!'];
      const reply = replies[Math.floor(Math.random()*replies.length)];
      const rTime = new Date().getHours()+':'+String(new Date().getMinutes()).padStart(2,'0');
      setTimeout(()=>{
        typingRow.remove();
        messagesDB[activeChat].push({from:activeChat,text:reply,time:rTime});
        chatPreviews[activeChat]=reply;
        chatTimes[activeChat]=rTime;
        renderMessages(activeChat);
        renderChatList(usersDB);
      },1500);
    },800);
  }
}

function handleMsgKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

// ──────────────── SEARCH ────────────────
function toggleSearch(){
  const panel=document.getElementById('search-panel');
  const btn=document.getElementById('search-btn');
  const isOpen=panel.classList.contains('open');
  panel.classList.toggle('open');
  btn.classList.toggle('active',!isOpen);
  if(!isOpen) setTimeout(()=>document.getElementById('search-big-input').focus(),100);
}

function setFilter(f,el){
  searchFilter=f;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  handleSearch(document.getElementById('search-big-input').value);
}

function handleSearch(q){
  const container=document.getElementById('search-results');
  const qLower=q.toLowerCase().trim();
  if(!qLower){container.innerHTML='<div class="no-results"><div class="no-results-icon">🔍</div><p>Введите ID или номер телефона</p></div>';return;}
  const stored=JSON.parse(localStorage.getItem('limeet_users')||'[]');
  const allUsers=[...usersDB,...stored.filter(u=>u.id!==currentUser?.id)];
  const results=allUsers.filter(u=>{
    if(searchFilter==='id') return u.username.toLowerCase().includes(qLower);
    if(searchFilter==='phone') return u.phone.includes(qLower);
    return u.username.toLowerCase().includes(qLower)||u.phone.includes(qLower)||u.name.toLowerCase().includes(qLower);
  });
  if(!results.length){container.innerHTML='<div class="no-results"><div class="no-results-icon">😕</div><p>Пользователь не найден</p></div>';return;}
  container.innerHTML='';
  results.forEach(u=>{
    const item=document.createElement('div');
    item.className='search-result-item';
    const avHTML=u.avatar?`<div class="avatar${u.online?' online':''}" style="background:${u.color||'#7c3aed'}"><img src="${u.avatar}" alt=""></div>`:`<div class="avatar${u.online?' online':''}" style="background:${u.color||'#7c3aed'}">${getInitials(u.name)}</div>`;
    item.innerHTML=`${avHTML}<div class="result-info"><div class="result-name">${u.name}</div><div class="result-sub">${u.username} · ${u.phone}</div></div><button class="start-chat-btn" onclick="startChat('${u.id}')">Написать</button>`;
    container.appendChild(item);
  });
}

function startChat(userId){
  const user=usersDB.find(u=>u.id===userId);
  if(!user)return;
  if(!messagesDB[userId])messagesDB[userId]=[];
  toggleSearch();
  openChat(userId);
}

// ──────────────── PROFILE ────────────────
function formatBirthday(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} г.`;
}

function isBirthdayToday(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date();
  return d.getDate()===now.getDate() && d.getMonth()===now.getMonth();
}

function fillProfilePanel(u, isMe) {
  document.getElementById('panel-title').textContent = isMe ? 'Мой профиль' : 'Профиль';

  // Avatar
  const avLarge = document.getElementById('profile-avatar-large');
  avLarge.style.background = u.color || '#7c3aed';
  // keep overlay
  const overlay = '<div class="avatar-upload-overlay">📷</div>';
  if (u.avatar) {
    avLarge.innerHTML = `<img src="${u.avatar}" alt="">${isMe?overlay:''}`;
  } else {
    avLarge.innerHTML = getInitials(u.name) + (isMe ? overlay : '');
  }
  // cover
  document.getElementById('profile-cover').style.background = `linear-gradient(135deg, ${u.color||'#7c3aed'} 0%, #1a1a1a 100%)`;

  document.getElementById('profile-name').textContent = u.name;
  document.getElementById('profile-username').textContent = u.username;

  const bioEl = document.getElementById('profile-bio-display');
  if (u.bio) { bioEl.textContent = u.bio; bioEl.classList.remove('empty'); }
  else { bioEl.textContent = 'Нет описания'; bioEl.classList.add('empty'); }

  // stats
  let msgCount = 0;
  if (isMe) { Object.values(messagesDB).forEach(msgs=>{ msgCount+=msgs.filter(m=>m.from==='me').length; }); }
  else { msgCount = (messagesDB[u.id]||[]).length; }
  document.getElementById('profile-msg-count').textContent = msgCount;
  const days = u.joinDate ? Math.floor((Date.now()-u.joinDate)/86400000) : (u.days||0);
  document.getElementById('profile-days').textContent = days;

  document.getElementById('profile-phone').textContent = u.phone;
  document.getElementById('profile-id-field').textContent = u.username;

  // birthday
  const bdRow = document.getElementById('profile-birthday-row');
  if (u.birthday) {
    bdRow.style.display='flex';
    const isToday = isBirthdayToday(u.birthday);
    document.getElementById('profile-birthday-value').innerHTML = formatBirthday(u.birthday) + (isToday ? ' <span class="birthday-badge">🎉 Сегодня!</span>' : '');
  } else {
    bdRow.style.display='none';
  }

  document.getElementById('profile-panel').classList.add('open');
}

function openMyProfile() {
  profileMode='me';
  fillProfilePanel(currentUser, true);
  document.getElementById('profile-edit-section').innerHTML=`
    <button class="edit-btn" onclick="openEditModal()">✏️ Редактировать профиль</button>
    <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>`;
}

function openContactProfile() {
  if (!activeChat) return;
  profileMode='contact';
  const u = usersDB.find(u=>u.id===activeChat);
  if (!u) return;
  fillProfilePanel(u, false);
  document.getElementById('profile-edit-section').innerHTML='';
}

function closeProfile(){document.getElementById('profile-panel').classList.remove('open');}

// click avatar in profile panel (only for own profile)
function handleProfileAvatarClick(){
  if(profileMode==='me') openEditModal();
}

// ──────────────── EDIT MODAL ────────────────
function openEditModal(){
  pendingAvatarDataURL = null;
  // fill fields
  document.getElementById('edit-name').value = currentUser.name;
  document.getElementById('edit-bio').value = currentUser.bio||'';
  document.getElementById('edit-birthday').value = currentUser.birthday||'';
  updateBioCount();

  // avatar preview
  const preview = document.getElementById('modal-avatar-preview');
  const delBtn = document.getElementById('del-avatar-btn');
  const overlay='<div class="avatar-upload-overlay">📷</div>';
  if (currentUser.avatar) {
    preview.style.background = currentUser.color||'#7c3aed';
    preview.innerHTML = `<img src="${currentUser.avatar}" alt="">${overlay}`;
    delBtn.style.display='inline-block';
  } else {
    preview.style.background = currentUser.color||'#7c3aed';
    preview.innerHTML = getInitials(currentUser.name) + overlay;
    delBtn.style.display='none';
  }

  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal(){
  document.getElementById('edit-modal').classList.remove('open');
  pendingAvatarDataURL = null;
}

function updateBioCount(){
  const val = document.getElementById('edit-bio').value;
  document.getElementById('bio-char-count').textContent = val.length;
}

function handleModalAvatarUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    pendingAvatarDataURL = ev.target.result;
    const preview = document.getElementById('modal-avatar-preview');
    const overlay='<div class="avatar-upload-overlay">📷</div>';
    preview.innerHTML = `<img src="${pendingAvatarDataURL}" alt="">${overlay}`;
    preview.style.background = 'transparent';
    document.getElementById('del-avatar-btn').style.display='inline-block';
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function deleteAvatar(){
  pendingAvatarDataURL = '__delete__';
  const preview = document.getElementById('modal-avatar-preview');
  const overlay='<div class="avatar-upload-overlay">📷</div>';
  preview.style.background = currentUser.color||'#7c3aed';
  preview.innerHTML = getInitials(currentUser.name) + overlay;
  document.getElementById('del-avatar-btn').style.display='none';
}

function saveProfile(){
  const name = document.getElementById('edit-name').value.trim();
  const bio = document.getElementById('edit-bio').value.trim();
  const birthday = document.getElementById('edit-birthday').value || null;
  if (!name) return;

  currentUser.name = name;
  currentUser.bio = bio;
  currentUser.birthday = birthday;

  if (pendingAvatarDataURL === '__delete__') {
    currentUser.avatar = null;
  } else if (pendingAvatarDataURL) {
    currentUser.avatar = pendingAvatarDataURL;
  }

  // persist
  const stored = JSON.parse(localStorage.getItem('limeet_users')||'[]');
  const idx = stored.findIndex(u=>u.id===currentUser.id);
  if (idx>-1){stored[idx]=currentUser; localStorage.setItem('limeet_users',JSON.stringify(stored));}
  localStorage.setItem('limeet_current', JSON.stringify(currentUser));

  closeEditModal();
  initApp();
  openMyProfile();
}

// ──────────────── LOGOUT ────────────────
function logout(){
  currentUser=null; activeChat=null;
  localStorage.removeItem('limeet_current');
  document.getElementById('app-screen').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('profile-panel').classList.remove('open');
  document.getElementById('chat-view').style.display='none';
  document.getElementById('empty-state').style.display='flex';
  document.getElementById('auth-error').textContent='';
  document.getElementById('login-id').value='';
  document.getElementById('login-pass').value='';
  switchTab('login');
}

// ──────────────── AUTO LOGIN ────────────────
window.addEventListener('DOMContentLoaded',()=>{
  const saved = localStorage.getItem('limeet_current');
  if(saved){try{loginUser(JSON.parse(saved));}catch(e){}}
});
</script>
